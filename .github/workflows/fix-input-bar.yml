name: Fix input-bar syntax

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fix malformed RefObject generic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/cui/src/components/input-bar.tsx")
          content = path.read_text(encoding="utf-8")
          old = '''scrollRef: RefObject
    ScrollBoxRenderable | null
  >;'''
          new = '''scrollRef: RefObject<
    ScrollBoxRenderable | null
  >;'''

          if old not in content:
              raise SystemExit("Expected malformed RefObject declaration was not found")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-input-bar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cui): correct RefObject generic syntax"
          git push
