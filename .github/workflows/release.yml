name: Publicar npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Conferir versão da tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/myagent/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            console.error(`Tag incompatível: esperado v${version}.`);
            process.exit(1);
          }
          JS
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run typecheck
      - run: bun test
      - name: Validar instalação do tarball
        shell: pwsh
        run: ./scripts/package-smoke.ps1
      # Configure o Trusted Publisher npm com este repositório e release.yml.
      - run: npm publish --provenance --access public
        working-directory: packages/myagent
